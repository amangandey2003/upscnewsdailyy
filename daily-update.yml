name: Daily UPSC Briefing Auto-Update

on:
  schedule:
    # 6:00 AM IST = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      manual_date:
        description: 'Force date (optional, e.g. 19 September 2026)'
        required: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 feedparser
          echo "Dependencies installed"

      - name: Run daily briefing updater
        run: |
          python scripts/update_briefing.py
          ls -lh last-update.json || true
          cat last-update.json

      - name: Commit changes
        run: |
          git config user.name "UPSC Hindu Bot"
          git config user.email "bot@upsc-hindu.app"
          git add last-update.json deploy-ready/index.html || true
          git add . || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date +'%d %b %Y')
            git commit -m "📰 Auto-update briefing for $DATE - $GITHUB_RUN_ID"
            git push
            echo "✅ Pushed to GitHub - Netlify will auto-deploy in ~30 sec"
          fi

      - name: Trigger Netlify Deploy (if not linked to GitHub)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "Triggering Netlify deploy via API..."
            curl -X POST "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/builds" \
                 -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" || true
          else
            echo "Netlify auto-deploy via GitHub link is active - no token needed"
            echo "If your Netlify site is linked to GitHub, it will auto-deploy on push"
          fi

      - name: Send notification via ntfy.sh
        run: |
          TOPIC="upsc-hindu-${{ github.repository_owner }}"
          DATE=$(date +'%d %b')
          curl -d "Your UPSC briefing for $DATE is live on https://extraordinary-empanada-1661c9.netlify.app - 12 stories, quiz, vault updated" \
               -H "Title: UPSC Hindu - Daily Briefing Ready 📰" \
               -H "Priority: high" \
               -H "Tags: newspaper,books" \
               https://ntfy.sh/$TOPIC || true
          echo "Push sent to ntfy.sh/$TOPIC"
